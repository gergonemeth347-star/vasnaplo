<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101317">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vasnapló">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
</style>
<title>Vasnapló</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column like a gym logbook page; bottom tab bar between Áttekintés and Edzések; fixed action bar during a workout. Single dark look by choice. */
:root {
  --bg: #101317;
  --surface: #181d23;
  --surface-2: #222932;
  --line: #2c343e;
  --fg: #eef1f4;
  --muted: #8d98a5;
  --accent: #f2c230;
  --on-accent: #17140a;
  --danger: #ef5a5f;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --radius: 14px;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body {
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
.wrap {
  max-width: 560px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px calc(104px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.wrap.has-bar { padding-block-end: calc(130px + env(safe-area-inset-bottom, 0px)); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.eyebrow {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 0.95rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
}
h1, h2 { font-family: var(--font-display); font-weight: 700; margin: 0; text-wrap: balance; }
h1 { font-size: 2.3rem; line-height: 1.05; }
h2 { font-size: 1.35rem; letter-spacing: 0.02em; text-transform: uppercase; }
.muted { color: var(--muted); }
.head { display: flex; flex-direction: column; gap: 4px; }
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

.btn {
  min-height: 56px;
  padding: 0 20px;
  border-radius: var(--radius);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.25rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-primary:active { filter: brightness(0.9); }
.btn-ghost { background: var(--surface-2); color: var(--fg); }
.btn-danger-ghost { background: transparent; color: var(--danger); border: 1.5px solid var(--line); }
.btn-danger-ghost[data-armed="1"] { background: var(--danger); color: var(--bg); border-color: var(--danger); }
.btn-block { width: 100%; min-height: 68px; font-size: 1.5rem; }
.btn-small { min-height: 44px; font-size: 1.05rem; padding: 0 14px; }

.start-card, .active-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.active-card { border: 1.5px solid var(--accent); }
.start-sub { color: var(--muted); font-size: 0.92rem; }
.day-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.day-row .btn { min-height: 50px; font-size: 1.1rem; padding: 0 8px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 12px;
  min-width: 0;
}
.stat b {
  display: block;
  font-family: var(--font-display);
  font-size: 1.8rem;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.stat span { font-size: 0.8rem; color: var(--muted); line-height: 1.25; display: block; }

.chart-card { background: var(--surface); border-radius: var(--radius); padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 8px; }
.readout { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.readout b { font-family: var(--font-display); font-size: 1.7rem; line-height: 1; font-variant-numeric: tabular-nums; }
.readout span { color: var(--muted); font-size: 0.88rem; }
.chart { width: 100%; min-width: 0; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-family: var(--font-body); font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .bar { fill: var(--accent); opacity: 0.45; }
.chart .bar.sel { opacity: 1; }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--accent); opacity: 0.08; }
.chart .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .dot.sel { r: 6; }
.chart .hit { fill: transparent; cursor: pointer; }
.chart .end-label { fill: var(--fg); font-weight: 600; font-size: 12px; }
.chart-hint { font-size: 0.78rem; color: var(--muted); }

select {
  min-height: 44px;
  background: var(--surface-2);
  border: 1.5px solid var(--line);
  border-radius: 12px;
  padding: 0 12px;
  font-size: 1rem;
  max-width: 100%;
  min-width: 0;
}

.list { display: flex; flex-direction: column; gap: 8px; }
.row {
  width: 100%;
  text-align: left;
  background: var(--surface);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 2px 12px;
  align-items: center;
}
button.row:active { background: var(--surface-2); }
.row-title { font-weight: 600; font-size: 1.05rem; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }
.row-sub { grid-column: 1; color: var(--muted); font-size: 0.9rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-vol {
  grid-column: 2; grid-row: 1 / span 2;
  font-family: var(--font-display); font-weight: 700; font-size: 1.3rem;
  font-variant-numeric: tabular-nums; text-align: right;
}
.row-vol small { display: block; font-family: var(--font-body); font-weight: 400; font-size: 0.75rem; color: var(--muted); }
.chip {
  font-family: var(--font-body);
  font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
  padding: 2px 8px; border-radius: 99px; border: 1px solid var(--muted); color: var(--muted);
  white-space: nowrap;
}
.chip-day { border-color: var(--accent); color: var(--accent); }
.empty { background: var(--surface); border-radius: var(--radius); padding: 20px; color: var(--muted); text-align: center; }
.note { font-size: 0.85rem; color: var(--muted); margin: 0; }

.pr { background: var(--surface); border-radius: var(--radius); }
.pr-row { display: flex; justify-content: space-between; gap: 12px; padding: 11px 14px; border-top: 1px solid var(--line); align-items: baseline; }
.pr-row:first-child { border-top: 0; }
.pr-name { min-width: 0; overflow-wrap: anywhere; }
.pr-val { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pr-val b { font-family: var(--font-display); font-size: 1.2rem; }
.pr-val small { display: block; color: var(--muted); font-size: 0.75rem; }

/* Tab bar */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--bg);
  border-top: 1px solid var(--line);
  padding-top: 6px;
  padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.tabs-inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.tab { font-size: 0.78rem; min-width: 0; }

/* Szálkásítás */
.stats-2 { grid-template-columns: repeat(2, 1fr); }
.weigh { background: var(--surface); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.weigh-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.weigh-row > * { min-width: 0; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-size: 0.8rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.field input[type="date"], .field .num { background: var(--surface-2); border-color: transparent; }
.goal-row { display: flex; gap: 8px; align-items: flex-end; }
.goal-row .field { flex: 1; }
.goal-row .num { font-size: 1.3rem; min-height: 56px; }
.goal-row .btn { flex: none; }
.field input[type="date"] { min-height: 56px; font-size: 1.05rem; padding: 0 10px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sw-line { width: 16px; height: 2px; border-radius: 1px; background: var(--accent); }
.chart .wdot { fill: var(--muted); stroke: var(--surface); stroke-width: 1.5; }
.chart .wdot.sel { fill: var(--fg); }
.delta { color: var(--muted); font-size: 0.8rem; }
.entry { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 6px 6px 14px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.entry:first-child { border-top: 0; }
.entry b { font-family: var(--font-display); font-size: 1.2rem; }
.entry-right { display: flex; align-items: center; gap: 6px; }
.data-box {
  width: 100%; min-height: 96px; resize: vertical;
  background: var(--surface-2); color: var(--fg);
  border: 1.5px solid transparent; border-radius: 12px;
  padding: 10px 12px; font: 0.8rem/1.4 ui-monospace, Menlo, Consolas, monospace;
}
.data-box:focus { border-color: var(--accent); outline: none; }
.tab {
  min-height: 58px; border-radius: 12px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--muted); font-weight: 600; font-size: 0.85rem;
}
.tab svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--accent); background: var(--surface); }

/* Workout view */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.back { min-height: 44px; padding: 0 4px; color: var(--muted); font-weight: 600; }
.date-field { display: flex; flex-direction: column; gap: 6px; }
.date-field label { font-size: 0.8rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
input[type="date"], .text-input {
  min-height: 56px;
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  padding: 0 14px;
  font-size: 1.1rem;
  width: 100%;
  min-width: 0;
}
input:focus { border-color: var(--accent); outline: none; }

.ex {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.ex-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.ex-title { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ex-name { font-family: var(--font-display); font-weight: 700; font-size: 1.45rem; line-height: 1.1; overflow-wrap: anywhere; }
.ex-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.ex-note { font-size: 0.85rem; color: var(--muted); }
.last { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.last b { color: var(--fg); font-weight: 600; }
.sets { display: flex; flex-direction: column; gap: 8px; }
.set {
  display: grid;
  grid-template-columns: 28px 1fr 18px 1fr 44px;
  align-items: center;
  gap: 8px;
}
.set-n { font-family: var(--font-display); font-weight: 700; color: var(--muted); font-size: 1.1rem; text-align: center; font-variant-numeric: tabular-nums; }
.num-wrap { position: relative; min-width: 0; }
.num {
  width: 100%;
  min-height: 56px;
  background: var(--surface-2);
  border: 1.5px solid transparent;
  border-radius: 12px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.6rem;
  text-align: center;
  padding: 0 34px 0 10px;
  font-variant-numeric: tabular-nums;
}
.num::placeholder { color: #47515d; font-size: 1.2rem; }
.unit { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 0.8rem; color: var(--muted); pointer-events: none; }
.times { text-align: center; color: var(--muted); font-weight: 600; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 12px; flex: none;
  display: grid; place-items: center;
  color: var(--muted); font-size: 1.4rem; line-height: 1;
}
.icon-btn:active { background: var(--surface-2); }
.icon-btn[data-armed="1"] { background: var(--danger); color: var(--bg); }
.add-set { border: 1.5px dashed var(--line); background: transparent; color: var(--fg); }

.add-ex { display: flex; gap: 8px; }
.add-ex .btn { flex: none; }

.bar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  background: var(--bg);
  border-top: 1px solid var(--line);
  padding-top: 12px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  z-index: 5;
}
.bar-inner { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.bar-vol { display: flex; justify-content: space-between; font-size: 0.9rem; color: var(--muted); }
.bar-vol b { color: var(--fg); font-variant-numeric: tabular-nums; }
.bar-btns { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }

/* Detail */
.d-sets { display: flex; flex-direction: column; }
.d-set {
  display: flex; justify-content: space-between; gap: 12px;
  padding: 8px 0; border-top: 1px solid var(--line);
  font-variant-numeric: tabular-nums;
}
.d-set:first-child { border-top: 0; }
.d-set b { font-family: var(--font-display); font-size: 1.3rem; }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(90px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  background: var(--fg);
  color: var(--bg);
  font-weight: 600;
  padding: 12px 18px;
  border-radius: 99px;
  z-index: 20;
  max-width: calc(100% - 32px);
  text-align: center;
}
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: rise 0.2s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, 8px); } }
}
@media (max-width: 360px) {
  .stat b { font-size: 1.5rem; }
}

/* Közös: pontok és jutalmak */
.modal-back { position: fixed; inset: 0; z-index: 40; background: rgba(5, 4, 8, 0.72); display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { width: 100%; max-width: 400px; background: var(--surface); border: 1.5px solid var(--accent); border-radius: 20px; padding: 22px 18px 18px; display: flex; flex-direction: column; gap: 10px; }
.modal h2 { font-size: 1.5rem; line-height: 1.15; text-transform: none; letter-spacing: 0; }
.modal-icon { width: 52px; height: 52px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; color: var(--accent); }
.modal-icon svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.modal-btns { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; margin-top: 6px; }
@media (prefers-reduced-motion: no-preference) {
  .modal { animation: pop 0.22s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(12px) scale(0.97); } }
}
.sc-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sc-card { background: var(--surface); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.sc-card.me { box-shadow: inset 0 0 0 1.5px var(--accent); }
.sc-name { font-size: 0.85rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sc-pts { font-family: var(--font-display); font-weight: 700; font-size: 2.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.sc-pts small { font-family: var(--font-body); font-size: 0.85rem; font-weight: 500; color: var(--muted); }
.dots { display: flex; gap: 6px; align-items: center; font-size: 0.8rem; color: var(--muted); }
.dots i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--accent); }
.dots i.on { background: var(--accent); }
.dots span { margin-left: 4px; }
.reward { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 10px 10px 14px; border-top: 1px solid var(--line); }
.reward:first-child { border-top: 0; }
.reward-txt { min-width: 0; display: flex; flex-direction: column; }
.reward-txt b { font-weight: 600; }
.reward-txt small { color: var(--muted); font-variant-numeric: tabular-nums; }
.reward-desc { color: var(--muted); font-size: 0.85rem; line-height: 1.35; margin-top: 2px; }
.reward-txt small.reward-cost { color: var(--accent); font-weight: 600; margin-top: 4px; }
.reward-txt { gap: 0; }
.reward .btn { flex: none; min-width: 108px; }
.reward .btn:disabled { opacity: 0.4; cursor: default; }
.todo { background: var(--surface); border: 1.5px solid var(--accent); border-radius: var(--radius); }
.feed-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 0.92rem; }
.feed-row:first-child { border-top: 0; }
.feed-row span:first-child { min-width: 0; }
.feed-row time { color: var(--muted); font-size: 0.8rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.feed-pts { color: var(--accent); font-weight: 600; white-space: nowrap; }
.sync { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 0.82rem; color: var(--muted); }
.sync .btn { min-height: 40px; font-size: 0.95rem; }

/* Állatkák */
.pet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pet-card { background: var(--surface); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.pet-card.me { box-shadow: inset 0 0 0 1.5px var(--accent); }
.pet-stage { aspect-ratio: 1; max-width: 100%; border-radius: 14px; background: radial-gradient(circle at 50% 58%, var(--surface-2), var(--surface) 72%); }
.pet-stage svg, .pet-home-art svg { width: 100%; height: 100%; display: block; }
.pet-name { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; line-height: 1.1; }
.pet-mood { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--muted); line-height: 1.3; }
.pet-mood i { width: 8px; height: 8px; border-radius: 50%; flex: none; background: #7bd88f; }
.pet-mood.m-sleepy i { background: #cfc3ff; }
.pet-mood.m-sad i { background: #7cc8ff; }
.pet-bar { display: block; height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.pet-bar span { display: block; height: 100%; border-radius: 99px; background: var(--accent); min-width: 6px; }
.pet-next { font-size: 0.78rem; color: var(--muted); line-height: 1.3; }
.pet-empty { justify-content: flex-start; }
.vitrin { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; padding-top: 4px; border-top: 1px solid var(--line); margin-top: 2px; font-size: 0.75rem; color: var(--muted); }
.vitrin .vitrin-pet { width: 30px; height: 30px; }
.pet-home { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border-radius: var(--radius); padding: 10px 14px 10px 10px; }
.pet-home:active { background: var(--surface-2); }
.pet-home-art { width: 76px; height: 76px; flex: none; border-radius: 12px; background: radial-gradient(circle at 50% 58%, var(--surface-2), var(--surface) 72%); }
.pet-home-txt { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
.pet-home-txt b { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; }
.pet-home-txt small { color: var(--muted); font-size: 0.8rem; }

@media (prefers-reduced-motion: no-preference) {
  .pet-svg.idle { animation: petbob 2.6s ease-in-out infinite; transform-origin: 50% 90%; }
  .pet-svg.idle.mood-sad { animation-duration: 4s; }
  .pet-svg .wing { transform-box: view-box; transform-origin: 100px 110px; animation: flap 1.5s ease-in-out infinite; }
  .pet-svg.mood-sleepy .wing, .pet-svg.mood-sad .wing { animation-duration: 3.2s; }
  .pet-svg .pet-z { animation: zfloat 2.4s ease-in-out infinite; }
  @keyframes petbob { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-4%) scale(1.01, .99); } }
  @keyframes flap { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(.82); } }
  @keyframes zfloat { 0%, 100% { opacity: .35; transform: translateY(4px); } 50% { opacity: 1; transform: translateY(-4px); } }
}

/* Fejlődés-animáció */
.evo-back { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; overflow: hidden;
  background: radial-gradient(circle at 50% 42%, #3a2844, #08060c 70%);
  opacity: 0; transition: opacity .25s ease;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.evo-back.on { opacity: 1; }
.evo-rays { position: absolute; left: 50%; top: 42%; width: 170vmax; height: 170vmax; margin: -85vmax 0 0 -85vmax; opacity: 0;
  background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--accent) 22%, transparent) 0deg 9deg, transparent 9deg 22deg);
  -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 55%); mask-image: radial-gradient(circle, #000 0%, transparent 55%); }
.evo-back.done .evo-rays { opacity: 1; transition: opacity .4s ease; }
.evo-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.evo-inner { position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; max-width: 380px; text-align: center; }
.evo-kicker { font-size: 0.8rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.evo-title { font-family: var(--font-display); font-weight: 700; font-size: 2.2rem; line-height: 1.05; color: var(--fg); }
.evo-stage { position: relative; width: min(64vw, 250px); aspect-ratio: 1; }
.evo-glow { position: absolute; inset: 8%; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--accent) 55%, transparent), transparent 68%); opacity: .35; }
.evo-pet { position: absolute; inset: 0; }
.evo-pet svg { width: 100%; height: 100%; display: block; }
.evo-burst { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
.evo-burst i { position: absolute; width: 10px; height: 14px; left: -5px; top: -7px; border-radius: 2px; opacity: 0; }
.evo-burst i.round { width: 10px; height: 10px; border-radius: 50%; }
.evo-text { display: flex; flex-direction: column; gap: 6px; min-height: 72px; color: var(--fg); font-size: 1.05rem; line-height: 1.4; }
.evo-text b { font-family: var(--font-display); font-size: 1.6rem; color: var(--accent); }
.evo-text span { color: var(--fg); }
.evo-text span + span { color: var(--muted); font-size: 0.95rem; }
.evo-btn { min-width: 200px; }

@media (prefers-reduced-motion: no-preference) {
  .evo-pet.charge { animation: charge 1.9s cubic-bezier(.4, 0, .9, .6) forwards; }
  .evo-back:not(.done) .evo-glow { animation: glowup 1.9s ease-in forwards; }
  .evo-back.flash .evo-flash { animation: flash .7s ease-out forwards; }
  .evo-pet.pop { animation: pop .75s cubic-bezier(.2, 1.6, .4, 1) both; }
  .evo-back.done .evo-glow { opacity: .7; animation: glowpulse 2.4s ease-in-out infinite; }
  .evo-back.done .evo-rays { animation: spin 14s linear infinite; }
  .evo-burst i { animation: confetti 1.5s cubic-bezier(.15, .7, .3, 1) var(--delay) forwards; }
  .evo-back.done .evo-title { animation: titlein .5s cubic-bezier(.2, 1.4, .4, 1) both; }
  .evo-back.done .evo-text { animation: fadeup .5s .25s ease-out both; }
  .evo-btn:not([hidden]) { animation: fadeup .4s ease-out both; }
  @keyframes charge {
    0% { transform: translate(0, 0) scale(1); filter: brightness(1); }
    20% { transform: translate(-2px, 1px) scale(1.01); }
    40% { transform: translate(3px, -2px) scale(1.03); filter: brightness(1.2); }
    55% { transform: translate(-4px, 2px) rotate(-3deg) scale(1.04); }
    70% { transform: translate(5px, -3px) rotate(4deg) scale(1.06); filter: brightness(1.6); }
    85% { transform: translate(-6px, 3px) rotate(-5deg) scale(1.08); filter: brightness(2.2); }
    100% { transform: translate(0, 0) scale(1.12); filter: brightness(4) saturate(0); }
  }
  @keyframes glowup { from { opacity: .3; transform: scale(.8); } to { opacity: 1; transform: scale(1.5); } }
  @keyframes flash { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes pop { 0% { transform: scale(.2); opacity: 0; } 60% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes glowpulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes confetti {
    0% { opacity: 1; transform: translate(0, 0) rotate(0); }
    80% { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--dx), calc(var(--dy) + 120px)) rotate(var(--rot)); }
  }
  @keyframes titlein { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes fadeup { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
}

/* Közös színpad */
.scene { position: relative; overflow: hidden; border-radius: 22px; padding: 14px 12px 14px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 16%, var(--bg)) 0%, var(--surface) 58%); }
.scene-sky { position: absolute; inset: 0 0 45% 0; pointer-events: none; }

.scene-sky i:nth-child(1) { left: 8%; top: 14%; }
.scene-sky i:nth-child(2) { left: 28%; top: 6%; width: 2px; height: 2px; }
.scene-sky i:nth-child(3) { left: 47%; top: 18%; }

.scene-arts { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

  background: radial-gradient(ellipse at 50% 30%, color-mix(in srgb, var(--accent) 14%, var(--surface-2)) 0%, var(--surface-2) 45%, transparent 72%); }
.actor-art { position: relative; aspect-ratio: 1; max-width: 100%; }

.actor-art.ghost { display: grid; place-items: center; }
.actor-art.ghost span { font-family: var(--font-display); font-size: 3rem; font-weight: 700; color: var(--muted); opacity: .5; position: relative; z-index: 1; }
.scene-info { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 2px; }
.actor { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 5px; min-width: 0; }
.actor-name { font-size: 0.85rem; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.actor.me .actor-name { color: var(--accent); font-weight: 600; }
.actor-pts { font-family: var(--font-display); font-weight: 700; font-size: 1.9rem; line-height: 1; font-variant-numeric: tabular-nums; }
.actor-pts small { font-family: var(--font-body); font-size: 0.8rem; font-weight: 500; color: var(--muted); }
.actor-stage { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; margin-top: 4px; }
.actor .pet-bar { width: 100%; max-width: 150px; }
.actor .pet-mood { justify-content: center; }
.actor .dots { justify-content: center; }
.actor .vitrin { justify-content: center; width: 100%; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; background: var(--surface); border-radius: 14px; }
.seg button { min-height: 44px; border-radius: 10px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.seg button[aria-selected="true"] { background: var(--surface-2); color: var(--fg); }
.seg-badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--accent); color: var(--on-accent); font-size: 0.75rem; font-weight: 700; display: inline-grid; place-items: center; }
@media (prefers-reduced-motion: no-preference) {
  .scene-sky i { animation: twinkle 3s ease-in-out infinite; }
  .scene-sky i:nth-child(2n) { animation-delay: 1.2s; }
  .scene-sky i:nth-child(3n) { animation-delay: 2.1s; }
  @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .7; } }
}

<body>


<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<datalist id="ex-names"></datalist>

<script>
(function () {
  var KEY = 'vasnaplo.v1';

  /* Edzésterv: név, sorozatszám, ismétlés-tartomány, megjegyzés */
  var PLAN = {
    A: [
      ['Guggolás', 4, '6–8'],
      ['Fekvenyomás', 3, '6–8'],
      ['Evezés', 3, '8–10'],
      ['Lábhajlítás gépen', 3, '10–12'],
      ['Oldalemelés', 4, '12–15'],
      ['Bicepsz hajlítás', 3, '10–12']
    ],
    B: [
      ['Vállból nyomás', 3, '8–10'],
      ['Lehúzás széles fogással', 3, '8–12'],
      ['Bolgár guggolás', 3, '10', 'Lábanként'],
      ['Tárogatás', 3, '12–15', 'Gépen vagy kábelen'],
      ['Tricepsz letolás kábelen', 3, '10–12']
    ],
    C: [
      ['Lábtoló', 3, '10–12'],
      ['Ferde pados nyomás kézisúlyzóval', 4, '8–10'],
      ['Húzódzkodás', 3, '6–10', 'Vagy szűk fogású lehúzás'],
      ['Evezés', 3, '10–12'],
      ['Lábhajlítás gépen', 3, '10–12'],
      ['Oldalemelés', 4, '12–15'],
      ['Kalapács bicepsz', 3, '10–12', 'Szuperszett: felváltva a tricepsz nyújtással, kevés pihenővel', true],
      ['Fej fölötti tricepsz nyújtás kötéllel', 3, '10–12', 'Szuperszett: felváltva a kalapács bicepsszel', true]
    ]
  };
  var DAYS = ['A', 'B', 'C'];

  var storageOk = true;
  var view = 'home';
  var detailId = null;
  var selWeek = null;
  var selPoint = null;
  var pickedEx = null;
  var app = document.getElementById('app');

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function isoDate(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function parseIso(iso) { var p = iso.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function today() { return isoDate(new Date()); }
  function daysAgo(n) { var d = new Date(); d.setDate(d.getDate() - n); return isoDate(d); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function num(v) { if (v === '' || v == null) return NaN; return parseFloat(String(v).replace(',', '.')); }
  function fmtN(v) { return (Math.round(v * 10) / 10).toLocaleString('hu-HU'); }
  function fmtKg(v) { return Math.round(v).toLocaleString('hu-HU') + ' kg'; }
  function fmtDate(iso, opts) { return parseIso(iso).toLocaleDateString('hu-HU', opts || { month: 'short', day: 'numeric', weekday: 'long' }); }
  function shortDate(iso) { return parseIso(iso).toLocaleDateString('hu-HU', { month: 'short', day: 'numeric' }); }
  function mondayOf(iso) { var d = parseIso(iso); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return isoDate(d); }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && Array.isArray(s.workouts)) {
          s.workouts = s.workouts.filter(function (w) { return !w.example; });
          if (!Array.isArray(s.weights)) s.weights = [];
          if (typeof s.goal !== 'number') s.goal = null;
          if (!s.social) s.social = { name: '', outbox: [], events: [], lastSync: 0, error: '', seen: [] };
          if (!Array.isArray(s.social.seen)) s.social.seen = [];
          if (s.active) s.active.exercises.forEach(function (ex) { delete ex.target; delete ex.reps; });
          return s;
        }
      }
    } catch (e) { storageOk = false; }
    return { workouts: [], active: null, weights: [], goal: null, social: { name: '', outbox: [], events: [], lastSync: 0, error: '', seen: [] } };
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); storageOk = true; }
    catch (e) { storageOk = false; }
  }
  var state = load();
  save();

  /* Példa adatok a grafikonokhoz, amíg nincs saját edzés (nem mentődik el) */
  var BASE = {
    'Guggolás': 70, 'Fekvenyomás': 60, 'Evezés': 50, 'Lábhajlítás gépen': 35, 'Oldalemelés': 8, 'Bicepsz hajlítás': 12,
    'Vállból nyomás': 35, 'Lehúzás széles fogással': 50, 'Bolgár guggolás': 14, 'Tárogatás': 30, 'Tricepsz letolás kábelen': 22,
    'Lábtoló': 120, 'Ferde pados nyomás kézisúlyzóval': 22, 'Húzódzkodás': 0, 'Kalapács bicepsz': 12, 'Fej fölötti tricepsz nyújtás kötéllel': 18
  };
  function sampleWorkouts() {
    var out = [];
    var n = 14;
    for (var i = 0; i < n; i++) {
      var day = DAYS[i % 3];
      var ago = Math.round((n - 1 - i) * 3.5) + 1;
      var prog = i / 3;
      out.push({
        id: 'minta' + i, date: daysAgo(ago), day: day, savedAt: i,
        exercises: PLAN[day].map(function (p, j) {
          var base = BASE[p[0]] || 20;
          var kg = base === 0 ? 0 : Math.round((base * (1 + prog * 0.035)) / 2.5) * 2.5;
          var reps = parseInt(p[2], 10) + ((i + j) % 2);
          var sets = [];
          for (var k = 0; k < p[1]; k++) sets.push({ kg: String(kg), reps: String(base === 0 ? 6 + Math.floor(prog) - (k > 1 ? 1 : 0) : reps - (k > 1 ? 1 : 0)) });
          return { id: 'm' + i + j, name: p[0], sets: sets };
        })
      });
    }
    return out;
  }

  function volume(w) {
    var v = 0;
    w.exercises.forEach(function (ex) {
      ex.sets.forEach(function (s) { var k = num(s.kg), r = num(s.reps); if (!isNaN(k) && !isNaN(r)) v += k * r; });
    });
    return v;
  }
  function setCount(w) { return w.exercises.reduce(function (a, ex) { return a + ex.sets.length; }, 0); }
  function sortedDesc(list) {
    return list.slice().sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.savedAt || 0) - (a.savedAt || 0);
    });
  }
  function nextDay() {
    var last = sortedDesc(state.workouts).filter(function (w) { return w.day; })[0];
    if (!last) return 'A';
    return DAYS[(DAYS.indexOf(last.day) + 1) % 3];
  }
  function lastSetsFor(name) {
    var ws = sortedDesc(state.workouts);
    for (var i = 0; i < ws.length; i++) {
      for (var j = 0; j < ws[i].exercises.length; j++) {
        if (ws[i].exercises[j].name === name) return { date: ws[i].date, sets: ws[i].exercises[j].sets };
      }
    }
    return null;
  }

  var toastTimer;
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 2200);
  }

  function fillDatalist() {
    var names = {};
    DAYS.forEach(function (d) { PLAN[d].forEach(function (p) { names[p[0]] = 1; }); });
    state.workouts.forEach(function (w) { w.exercises.forEach(function (ex) { names[ex.name] = 1; }); });
    document.getElementById('ex-names').innerHTML = Object.keys(names).map(function (n) { return '<option value="' + esc(n) + '">'; }).join('');
  }

  /* ---------- Statisztika ---------- */
  function weeklyData(list) {
    var thisMon = mondayOf(today());
    var weeks = [];
    for (var i = 7; i >= 0; i--) {
      var d = parseIso(thisMon); d.setDate(d.getDate() - i * 7);
      weeks.push({ key: isoDate(d), value: 0, count: 0 });
    }
    list.forEach(function (w) {
      var k = mondayOf(w.date);
      weeks.forEach(function (wk) { if (wk.key === k) { wk.value += volume(w); wk.count++; } });
    });
    return weeks;
  }
  function progressFor(list, name) {
    var pts = [];
    list.slice().reverse().forEach(function (w) {
      w.exercises.forEach(function (ex) {
        if (ex.name !== name) return;
        var topKg = -1, topReps = 0;
        ex.sets.forEach(function (s) {
          var k = num(s.kg), r = num(s.reps);
          if (isNaN(k)) k = 0;
          if (isNaN(r)) r = 0;
          if (k > topKg || (k === topKg && r > topReps)) { topKg = k; topReps = r; }
        });
        if (topKg >= 0) pts.push({ date: w.date, kg: topKg, reps: topReps });
      });
    });
    return pts.slice(-12);
  }
  function exerciseNames(list) {
    var count = {};
    list.forEach(function (w) { w.exercises.forEach(function (ex) { count[ex.name] = (count[ex.name] || 0) + 1; }); });
    var order = [];
    DAYS.forEach(function (d) { PLAN[d].forEach(function (p) { if (count[p[0]] && order.indexOf(p[0]) < 0) order.push(p[0]); }); });
    Object.keys(count).forEach(function (n) { if (order.indexOf(n) < 0) order.push(n); });
    return order;
  }
  function records(list) {
    var best = {};
    list.forEach(function (w) {
      w.exercises.forEach(function (ex) {
        ex.sets.forEach(function (s) {
          var k = num(s.kg), r = num(s.reps);
          if (isNaN(k)) k = 0;
          if (isNaN(r)) r = 0;
          var b = best[ex.name];
          if (!b || k > b.kg || (k === b.kg && r > b.reps)) best[ex.name] = { kg: k, reps: r, date: w.date };
        });
      });
    });
    return exerciseNames(list).map(function (n) { return { name: n, rec: best[n] }; }).filter(function (x) { return x.rec; });
  }

  /* ---------- Grafikonok (SVG) ---------- */
  function niceStep(x) {
    if (x <= 0) return 1;
    var e = Math.pow(10, Math.floor(Math.log10(x)));
    var f = x / e;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e;
  }
  function tickLabel(v) { return v >= 10000 ? fmtN(v / 1000) + 'e' : fmtN(v); }
  function roundTopRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h);
    if (h <= 0) return '';
    return 'M' + x + ',' + (y + h) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'V' + (y + h) + 'Z';
  }

  function drawWeekly(el, weeks) {
    var W = Math.max(260, el.clientWidth || 320), H = 170, L = 40, R = 6, T = 10, B = 24;
    var pw = W - L - R, ph = H - T - B;
    var max = Math.max.apply(null, weeks.map(function (w) { return w.value; }));
    var step = niceStep((max || 1) / 3);
    var top = Math.ceil((max || 1) / step) * step;
    var y = function (v) { return T + ph - (v / top) * ph; };
    var slot = pw / weeks.length, bw = Math.min(30, slot - 8);
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Heti össztömeg az elmúlt 8 hétben">';
    for (var t = 0; t <= top + 0.001; t += step) {
      s += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(t) + '" y2="' + y(t) + '"/>';
      s += '<text x="' + (L - 6) + '" y="' + (y(t) + 4) + '" text-anchor="end">' + tickLabel(t) + '</text>';
    }
    var every = slot < 44 ? 2 : 1;
    weeks.forEach(function (wk, i) {
      var x = L + slot * i + (slot - bw) / 2;
      var h = (wk.value / top) * ph;
      var sel = i === selWeek;
      if (wk.value > 0) s += '<path class="bar' + (sel ? ' sel' : '') + '" d="' + roundTopRect(x, T + ph - h, bw, h, 4) + '"/>';
      if ((weeks.length - 1 - i) % every === 0) s += '<text x="' + (x + bw / 2) + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(shortDate(wk.key).replace(/\.$/, '')) + '</text>';
      s += '<rect class="hit" data-act="week" data-i="' + i + '" x="' + (L + slot * i) + '" y="' + T + '" width="' + slot + '" height="' + ph + '"><title>' + esc(shortDate(wk.key)) + ': ' + fmtKg(wk.value) + '</title></rect>';
    });
    s += '</svg>';
    el.innerHTML = s;
  }

  function drawProgress(el, pts) {
    var W = Math.max(260, el.clientWidth || 320), H = 170, L = 40, R = 40, T = 14, B = 24;
    var pw = W - L - R, ph = H - T - B;
    var useReps = pts.every(function (p) { return p.kg === 0; });
    var vals = pts.map(function (p) { return useReps ? p.reps : p.kg; });
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    var step = niceStep(Math.max(hi - lo, hi * 0.1, 1) / 3);
    var min = Math.max(0, Math.floor((lo - step * 0.5) / step) * step);
    var max = Math.ceil((hi + step * 0.3) / step) * step;
    if (max <= min) max = min + step;
    var x = function (i) { return pts.length === 1 ? L + pw / 2 : L + (i / (pts.length - 1)) * pw; };
    var y = function (v) { return T + ph - ((v - min) / (max - min)) * ph; };
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Legnagyobb súly alakulása edzésenként">';
    for (var t = min; t <= max + 0.001; t += step) {
      s += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(t) + '" y2="' + y(t) + '"/>';
      s += '<text x="' + (L - 6) + '" y="' + (y(t) + 4) + '" text-anchor="end">' + tickLabel(t) + '</text>';
    }
    var d = '';
    vals.forEach(function (v, i) { d += (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(v).toFixed(1); });
    if (pts.length > 1) {
      s += '<path class="area" d="' + d + 'L' + x(pts.length - 1).toFixed(1) + ',' + (T + ph) + 'L' + x(0).toFixed(1) + ',' + (T + ph) + 'Z"/>';
      s += '<path class="line" d="' + d + '"/>';
    }
    var sel = selPoint == null || selPoint >= pts.length ? pts.length - 1 : selPoint;
    vals.forEach(function (v, i) {
      s += '<circle class="dot' + (i === sel ? ' sel' : '') + '" cx="' + x(i).toFixed(1) + '" cy="' + y(v).toFixed(1) + '" r="' + (i === sel ? 6 : 4) + '"/>';
    });
    var lastV = vals[vals.length - 1];
    s += '<text class="end-label" x="' + (x(pts.length - 1) + 9) + '" y="' + (y(lastV) + 4) + '">' + fmtN(lastV) + '</text>';
    s += '<text x="' + x(0) + '" y="' + (H - 6) + '" text-anchor="' + (pts.length === 1 ? 'middle' : 'start') + '">' + esc(shortDate(pts[0].date).replace(/\.$/, '')) + '</text>';
    if (pts.length > 1) s += '<text x="' + x(pts.length - 1) + '" y="' + (H - 6) + '" text-anchor="end">' + esc(shortDate(pts[pts.length - 1].date).replace(/\.$/, '')) + '</text>';
    var hw = pts.length === 1 ? pw : pw / (pts.length - 1);
    pts.forEach(function (p, i) {
      s += '<rect class="hit" data-act="point" data-i="' + i + '" x="' + (x(i) - hw / 2) + '" y="' + T + '" width="' + hw + '" height="' + ph + '"><title>' + esc(shortDate(p.date)) + ': ' + fmtN(p.kg) + ' kg × ' + p.reps + '</title></rect>';
    });
    s += '</svg>';
    el.innerHTML = s;
    return { useReps: useReps, sel: sel };
  }

  /* ---------- Szálkásítás ---------- */
  var selW = null;
  function byDateAsc(a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; }
  function avg(arr) { return arr.length ? arr.reduce(function (a, b) { return a + b; }, 0) / arr.length : NaN; }
  function fmt1(v) { return (Math.round(v * 10) / 10).toLocaleString('hu-HU', { minimumFractionDigits: 1, maximumFractionDigits: 1 }); }
  function signed(v, dec) {
    var r = Math.round(v * Math.pow(10, dec)) / Math.pow(10, dec);
    var s = Math.abs(r).toLocaleString('hu-HU', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    return r > 0 ? '+' + s : r < 0 ? '−' + s : s;
  }
  function sampleWeights() {
    var out = [];
    for (var i = 34; i >= 0; i--) {
      if (i % 6 === 3) continue;
      var t = 34 - i;
      var kg = 84.2 - t * 0.075 + Math.sin(t * 1.7) * 0.45 + (((t * 7) % 5) - 2) * 0.1;
      out.push({ date: daysAgo(i), kg: Math.round(kg * 10) / 10 });
    }
    return out;
  }
  function weightSource() {
    return state.weights.length ? { list: state.weights.slice().sort(byDateAsc), sample: false } : { list: sampleWeights(), sample: true };
  }
  function rolling(list) {
    return list.map(function (e) {
      var st = parseIso(e.date); st.setDate(st.getDate() - 6);
      var s = isoDate(st);
      return avg(list.filter(function (x) { return x.date >= s && x.date <= e.date; }).map(function (x) { return x.kg; }));
    });
  }
  function weekStats(list) {
    var map = {};
    list.forEach(function (e) { var k = mondayOf(e.date); (map[k] = map[k] || []).push(e.kg); });
    return Object.keys(map).sort().reverse().map(function (k) { return { key: k, avg: avg(map[k]), n: map[k].length }; });
  }

  function cutView() {
    var src = weightSource();
    var list = src.list;
    var last = list[list.length - 1];
    var todayEntry = state.weights.filter(function (e) { return e.date === today(); })[0];
    var h = '<div class="wrap">';
    h += '<header class="head"><div class="eyebrow">Vasnapló</div><h1>Szálkásítás</h1></header>';

    h += '<form class="weigh" id="weight-form"><div class="weigh-row">';

    h += '</div><button class="btn btn-primary" type="submit">' + (todayEntry ? 'Mai súly frissítése' : 'Mentés') + '</button>';
    h += '<p class="note">Mérj reggel, ébredés és mosdó után, evés előtt. A napi ingadozás víz és étel miatt teljesen normális, a heti átlag mutatja a valódi irányt.</p></form>';

    var roll = rolling(list);
    var wk = weekStats(list);
    var cur = wk[0], prev = wk[1];
    var nowAvg = roll[roll.length - 1];

    h += '<div class="sec"><div class="sec-head"><h2>Hogy állsz</h2>' + (src.sample ? '<span class="chip">Példa adatok</span>' : '') + '</div>';
    if (src.sample) h += '<p class="note">Az első mérésed után itt a saját számaid jelennek meg.</p>';
    h += '<div class="stats stats-2">';
    h += '<div class="stat"><b>' + fmt1(nowAvg) + '</b><span>kg, 7 napos átlag</span></div>';
    h += '<div class="stat"><b>' + signed(nowAvg - list[0].kg, 1) + '</b><span>kg a kezdés óta (' + esc(shortDate(list[0].date)) + ')</span></div>';
    if (cur && prev) {
      h += '<div class="stat"><b>' + signed(cur.avg - prev.avg, 1) + '</b><span>kg heti átlag az előző héthez</span></div>';
      h += '<div class="stat"><b>' + signed((cur.avg - prev.avg) / prev.avg * 100, 1) + '%</b><span>heti tempó a testsúlyodhoz</span></div>';
    } else {
      h += '<div class="stat"><b>–</b><span>heti változás (két hét adat kell hozzá)</span></div>';

        '{n} kölykéből fiatal oroszlán lett!',
        '{n} fiatal oroszlánja erős oroszlánná nőtt!',
        '{n} oroszlánja elérte a végső alakját: Vasoroszlán!'
      ]
    }
  };
  function petType(who) { return who === 'vas' ? 'lion' : 'cat'; }
  function petWorkouts(evs, who) {
    var revoked = {};
    evs.forEach(function (e) { if (e.kind === 'revoke') revoked[e.ref] = 1; });
    return evs.filter(function (e) { return e.who === who && e.kind === 'workout' && !revoked[e.ref]; });
  }
  function petState(evs, who) {
    var ws = petWorkouts(evs, who);
    var count = ws.length;
    var cycle = Math.floor(count / PET_CYCLE);
    var within = count - cycle * PET_CYCLE;
    var stage = 0;
    for (var i = 0; i < PET_STEPS.length; i++) if (within >= PET_STEPS[i]) stage = i;
    var next = stage < 3 ? PET_STEPS[stage + 1] : PET_CYCLE;
    var last = ws.reduce(function (a, e) { var d = String(e.day || '').slice(0, 10); return d > a ? d : a; }, '');
    var days = last ? Math.round((parseIso(today()) - parseIso(last)) / 86400000) : null;
    var mood = days === null ? 'happy' : days <= 2 ? 'happy' : days <= 4 ? 'sleepy' : 'sad';
    return { type: petType(who), count: count, cycle: cycle, stage: stage, within: within, next: next, left: next - within, days: days, mood: mood, key: cycle * 5 + stage };
  }
  function moodText(p, mine, name) {
    if (p.days === null) return mine ? 'Várja az első edzésed' : 'Várja ' + name + ' első edzését';
    if (p.mood === 'happy') return p.days === 0 ? (mine ? 'Vidám, ma edzettél' : 'Vidám, ma edzett') : (mine ? 'Vidám, nemrég edzettél' : 'Vidám, nemrég edzett');
    if (p.mood === 'sleepy') return 'Álmos, ' + p.days + ' napja nem ' + (mine ? 'edzettél' : 'edzett');
    return 'Szomorú, ' + p.days + ' napja nem ' + (mine ? 'edzettél' : 'edzett');
  }
  function petNextLabel(p) {
    var names = PETS[p.type].names;
    return 'Következő: ' + names[p.stage + 1] + ' · még ' + p.left + ' edzés';
  }
  function vitrinHtml(p) {
    if (!p.cycle) return '';
    var h = '<div class="vitrin" aria-label="Vitrin: ' + p.cycle + ' kész">';
    for (var i = 0; i < Math.min(p.cycle, 8); i++) h += petSvg(p.type, 4, i, 'happy', 'vitrin-pet');
    if (p.cycle > 8) h += '<span>+' + (p.cycle - 8) + '</span>';
    return h + '</div>';
  }
  function petCard(p, label, mine, name) {
    var pct = Math.round(((p.within - PET_STEPS[p.stage]) / (p.next - PET_STEPS[p.stage])) * 100);
    var h = '<div class="pet-card' + (mine ? ' me' : '') + '">';
    h += '<span class="sc-name">' + esc(label) + '</span>';
    h += '<div class="pet-stage">' + petSvg(p.type, p.stage, p.cycle, p.mood, 'idle') + '</div>';
    h += '<b class="pet-name">' + PETS[p.type].names[p.stage] + '</b>';
    h += '<span class="pet-mood m-' + p.mood + '"><i></i>' + esc(moodText(p, mine, name)) + '</span>';
    h += '<div class="pet-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><span style="width:' + pct + '%"></span></div>';
    h += '<span class="pet-next">' + esc(petNextLabel(p)) + '</span>';
    h += vitrinHtml(p);
    return h + '</div>';
  }
  function petsSection(evs, partnerWho, pName) {
    var me = petState(evs, APP_ID);
    var h = '<div class="sec"><h2>Állatkák</h2><div class="pet-grid">';
    h += petCard(me, state.social.name + ' (te)', true, '');
    if (partnerWho) h += petCard(petState(evs, partnerWho), pName, false, pName);
    else h += '<div class="pet-card pet-empty"><span class="sc-name">Párod</span><p class="note">A párod állatkája akkor jelenik meg, amikor csatlakozik a közös részhez.</p></div>';
    h += '</div><p class="note">Minden pontot érő edzés egy lépés. Kb. 3 hónap rendszeres edzéssel éri el a végső alakját, aztán a vitrinbe kerül, és új kör indul.</p></div>';
    return h;
  }
  function petHomeCard() {
    if (!SUPA_URL || !state.social || !state.social.name) return '';
    var p = petState(allEvents(), APP_ID);
    var pct = Math.round(((p.within - PET_STEPS[p.stage]) / (p.next - PET_STEPS[p.stage])) * 100);
    return '<button class="pet-home" data-act="tab-social" aria-label="Állatkád megnyitása a Közös fülön">' +
      '<span class="pet-home-art">' + petSvg(p.type, p.stage, p.cycle, p.mood, 'idle') + '</span>' +
      '<span class="pet-home-txt"><b>' + PETS[p.type].names[p.stage] + '</b><small>' + esc(moodText(p, true, '')) + '</small>' +
      '<span class="pet-bar"><span style="width:' + pct + '%"></span></span><small>' + esc(petNextLabel(p)) + '</small></span></button>';
  }

  /* ---------- Fejlődés-animáció ---------- */
  function checkPets() {
    if (!SUPA_URL || !state.social || !state.social.name) return;
    if (view === 'workout' || document.querySelector('.evo-back') || document.getElementById('sc-modal')) return;
    if (!state.social.petSeen) state.social.petSeen = {};
    var seen = state.social.petSeen;
    var evs = allEvents();
    var whos = [APP_ID];
    evs.forEach(function (e) { if (whos.indexOf(e.who) < 0) whos.push(e.who); });
    for (var i = 0; i < whos.length; i++) {
      var who = whos[i];
      var p = petState(evs, who);
      if (seen[who] == null || p.key < seen[who]) { seen[who] = p.key; save(); continue; }
      if (p.key > seen[who]) {
        var from = seen[who];
        var cyc = Math.floor(from / 5), st = from % 5;
        var nameEv = evs.filter(function (e) { return e.who === who && e.name; })[0];
        showEvolution({
          who: who, type: petType(who), cycle: cyc, from: st, to: st + 1,
          mine: who === APP_ID, name: nameEv ? nameEv.name : 'A párod',
          nextKey: st + 1 >= 4 ? (cyc + 1) * 5 : from + 1
        });
        return;
      }
    }
  }

  function showEvolution(ev) {
    var reduce = false;
    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    var cfg = PETS[ev.type];
    var final = ev.to === 4;
    var text = (ev.mine ? cfg.mine[ev.to - 1] : cfg.theirs[ev.to - 1].replace('{n}', ev.name));
    var o = document.createElement('div');
    o.className = 'evo-back';
    o.setAttribute('role', 'dialog');
    o.setAttribute('aria-modal', 'true');
    o.setAttribute('aria-label', 'Fejlődés');
    o.innerHTML = '<div class="evo-rays"></div><div class="evo-flash"></div>' +
      '<div class="evo-inner"><div class="evo-kicker">' + (ev.mine ? 'Az állatkád' : esc(ev.name) + ' állatkája') + '</div>' +
      '<div class="evo-title">Valami történik…</div>' +
      '<div class="evo-stage"><div class="evo-glow"></div><div class="evo-pet">' + petSvg(ev.type, ev.from, ev.cycle, 'happy') + '</div><div class="evo-burst"></div></div>' +
      '<div class="evo-text" aria-live="polite"></div>' +
      '<button class="btn btn-primary evo-btn" hidden>' + (final ? 'Irány a vitrin!' : 'Szuper!') + '</button></div>';
    document.body.appendChild(o);
    requestAnimationFrame(function () { o.classList.add('on'); });
    var pet = o.querySelector('.evo-pet');
    if (!reduce) pet.classList.add('charge');

    setTimeout(function () {
      o.classList.add('flash');
      try { if (navigator.vibrate) navigator.vibrate([40, 60, 40]); } catch (e) {}
      pet.classList.remove('charge');
      pet.innerHTML = petSvg(ev.type, ev.to, ev.cycle, 'happy', 'idle');
      pet.classList.add('pop');
      o.classList.add('done');
      if (!reduce) burst(o.querySelector('.evo-burst'), final ? 70 : 44);
      o.querySelector('.evo-title').textContent = final ? 'Kész! 🎉' : 'Fejlődés!';
      o.querySelector('.evo-text').innerHTML = '<b>' + cfg.names[ev.to] + '</b><span>' + esc(text) + '</span>' +
        (final ? '<span>Bekerült a vitrinbe, és érkezett ' + cfg.fresh + '.</span>' : '');
      setTimeout(function () {
        var btn = o.querySelector('.evo-btn');
        btn.hidden = false;
        btn.focus();
      }, reduce ? 100 : 700);
    }, reduce ? 500 : 1900);

    o.querySelector('.evo-btn').addEventListener('click', function () {
      state.social.petSeen[ev.who] = ev.nextKey;
      save();
      o.classList.remove('on');
      setTimeout(function () {
        o.remove();
        if (view === 'social' || view === 'home') render();
        checkPets();
      }, 250);
    });
  }

  function burst(host, n) {
    var colors = ['#f2c230', '#e57fd3', '#a985f0', '#6ec6ff', '#8fdc6a', '#ff7a8a', '#ffffff'];
    for (var i = 0; i < n; i++) {
      var s = document.createElement('i');
      var a = Math.random() * Math.PI * 2;
      var d = 90 + Math.random() * 130;
      s.style.setProperty('--dx', (Math.cos(a) * d).toFixed(0) + 'px');
      s.style.setProperty('--dy', (Math.sin(a) * d - 40).toFixed(0) + 'px');
      s.style.setProperty('--rot', (Math.random() * 720 - 360).toFixed(0) + 'deg');
      s.style.setProperty('--delay', (Math.random() * 120).toFixed(0) + 'ms');
      s.style.background = colors[i % colors.length];
      if (i % 3 === 0) s.className = 'round';
      host.appendChild(s);
    }
  }

  function render() {
    if (view === 'workout' && !state.active) view = 'home';
    app.innerHTML = view === 'workout' ? workoutView() : view === 'detail' ? detailView() : view === 'history' ? historyView() : view === 'cut' ? cutView() : view === 'social' ? socialView() : homeView();
    fillDatalist();
    if (view === 'home') drawCharts();
    if (view === 'cut') drawWeight();
  }
  function go(v) { view = v; render(); window.scrollTo(0, 0); }
  function findEx(id) { return state.active.exercises.filter(function (e) { return e.id === id; })[0]; }

  function armed(btn, label) {
    if (btn.dataset.armed === '1') return true;
    var orig = btn.textContent;
    btn.dataset.armed = '1';
    if (label) btn.textContent = label;
    setTimeout(function () { if (btn.isConnected) { btn.dataset.armed = ''; btn.textContent = orig; } }, 3000);
    return false;
  }

  function startWorkout(day) {
    var exercises = day ? PLAN[day].map(function (p) {
      var sets = [];
      for (var i = 0; i < p[1]; i++) sets.push({ kg: '', reps: '' });
      return { id: uid(), name: p[0], note: p[3] || '', superset: !!p[4], sets: sets };
    }) : [];
    state.active = { id: uid(), date: today(), day: day || '', exercises: exercises };
    save(); go('workout');
    if (!day) { var inp = document.getElementById('ex-name'); if (inp) inp.focus(); }
  }

  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var act = b.dataset.act;
    if (act === 'start') {
      startWorkout(b.dataset.day);
    } else if (act === 'resume') {
      go('workout');
    } else if (act === 'tab-home') {
      go('home');
    } else if (act === 'tab-history') {
      go('history');
    } else if (act === 'export') {
      var json = JSON.stringify({ app: 'vasnaplo', v: 1, workouts: state.workouts, weights: state.weights, goal: state.goal });
      var box = document.getElementById('data-box');
      var fallback = function () { box.value = json; box.focus(); box.select(); toast('Jelöld ki a szöveget, és másold ki'); };
      try {
        navigator.clipboard.writeText(json).then(function () { toast('Adatok kimásolva'); }, fallback);
      } catch (err) { fallback(); }
    } else if (act === 'import') {
      var raw = document.getElementById('data-box').value.trim();
      var data;
      try { data = JSON.parse(raw); } catch (err) { data = null; }
      if (!data || data.app !== 'vasnaplo' || !Array.isArray(data.workouts)) { toast('Ez nem Vasnapló adat. Másold ki újra a régi helyen.'); return; }
      if (!armed(b, 'Koppints újra a betöltéshez')) return;
      var ids = {};
      state.workouts.forEach(function (w) { ids[w.id] = 1; });
      var added = 0;
      data.workouts.forEach(function (w) { if (!ids[w.id]) { state.workouts.push(w); added++; } });
      (data.weights || []).forEach(function (wt) {
        state.weights = state.weights.filter(function (x) { return x.date !== wt.date; });
        state.weights.push(wt);
      });
      if (typeof data.goal === 'number') state.goal = data.goal;
      selWeek = null; selPoint = null; selW = null;
      save(); render();
      toast(added + ' edzés és ' + (data.weights || []).length + ' mérés betöltve');
    } else if (act === 'tab-social') {
      go('social'); sync();
    } else if (act === 'sc-tab') {
      scTab = b.dataset.t; render();
    } else if (act === 'push-on') {
      enablePush();
    } else if (act === 'push-test') {
      testPush(); toast('Küldés…');
    } else if (act === 'sync') {
      sync(); toast('Frissítés…');
    } else if (act === 'redeem') {
      var rw = REWARDS.filter(function (x) { return x[0] === b.dataset.r; })[0];
      if (!rw || pointsOf(allEvents(), APP_ID) < rw[2]) return;
      if (!armed(b, 'Biztos?')) return;
      queueEvent({ kind: 'redeem', points: -rw[2], label: rw[1], ref: rw[0] });
      render(); toast('Beváltva: ' + rw[1]);
    } else if (act === 'fulfill') {
      var rd = allEvents().filter(function (x) { return x.id === b.dataset.id; })[0];
      if (!rd) return;
      queueEvent({ kind: 'fulfill', points: 0, label: rd.label, ref: rd.id });
      render(); toast('Kipipálva');
    } else if (act === 'tab-cut') {
      selW = null; go('cut');
    } else if (act === 'wpoint') {
      selW = +b.dataset.i; drawWeight();
    } else if (act === 'del-weight') {
      if (!armed(b, '?')) return;
      state.weights = state.weights.filter(function (x) { return x.date !== b.dataset.date; });
      selW = null; save(); render(); toast('Mérés törölve');
    } else if (act === 'open') {
      detailId = b.dataset.id; go('detail');
    } else if (act === 'week') {
      selWeek = +b.dataset.i; drawCharts();
    } else if (act === 'point') {
      selPoint = +b.dataset.i; drawCharts();
    } else if (act === 'add-set') {
      var ex = findEx(b.dataset.ex);
      var last = ex.sets[ex.sets.length - 1];
      ex.sets.push(last ? { kg: last.kg, reps: last.reps } : { kg: '', reps: '' });
      save(); render();
      var f = document.getElementById('kg-' + ex.id + '-' + (ex.sets.length - 1));
      if (f) { f.focus(); f.select(); }
    } else if (act === 'del-set') {
      findEx(b.dataset.ex).sets.splice(+b.dataset.i, 1);
      save(); render();
    } else if (act === 'del-ex') {
      if (!armed(b, '?')) return;
      state.active.exercises = state.active.exercises.filter(function (x) { return x.id !== b.dataset.ex; });
      save(); render();
    } else if (act === 'discard') {
      if (!armed(b, 'Biztos?')) return;
      state.active = null; save(); go('home'); toast('Edzés elvetve');
    } else if (act === 'finish') {
      var a = state.active;
      var kept = a.exercises.map(function (x) {
        return { id: x.id, name: x.name, sets: x.sets.filter(function (s) { return s.kg !== '' || s.reps !== ''; }) };
      }).filter(function (x) { return x.sets.length; });
      if (!kept.length) { toast('Írj be legalább egy sorozatot a mentéshez'); return; }
      var w = { id: a.id, date: a.date, day: a.day || '', savedAt: Date.now(), exercises: kept };
      var pts = scoreWorkout(w);
      state.workouts.push(w);
      state.active = null;
      selWeek = null; selPoint = null;
      save();
      detailId = w.id; go('detail'); toast(pts ? 'Edzés elmentve · +' + pts + ' pont' : 'Edzés elmentve'); setTimeout(checkPets, 1400);
    } else if (act === 'del-workout') {
      if (!armed(b, 'Koppints újra a törléshez')) return;
      var dw = state.workouts.filter(function (x) { return x.id === b.dataset.id; })[0];
      var lost = dw && dw.points ? dw.points : 0;
      if (lost) revokeWorkout(dw);
      state.workouts = state.workouts.filter(function (x) { return x.id !== b.dataset.id; });
      selWeek = null; selPoint = null;
      save(); go('history'); toast(lost ? 'Edzés törölve · −' + lost + ' pont' : 'Edzés törölve');
    }
  });

  app.addEventListener('change', function (e) {
    if (e.target.id === 'ex-pick') { pickedEx = e.target.value; selPoint = null; drawCharts(); }
  });

  app.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'w-date' && state.active) { if (t.value) { state.active.date = t.value; save(); } return; }
    if (!t.dataset.field || !state.active) return;
    var ex = findEx(t.dataset.ex); if (!ex) return;
    ex.sets[+t.dataset.i][t.dataset.field] = t.value.trim();
    save();
    var lv = document.getElementById('live-vol'); if (lv) lv.textContent = fmtKg(volume(state.active));
  });

  app.addEventListener('submit', function (e) {
    if (e.target.id === 'sc-name-form') {
      e.preventDefault();
      var nm = document.getElementById('sc-name').value.trim().slice(0, 24);
      if (!nm) { document.getElementById('sc-name').focus(); return; }
      state.social.name = nm; save(); render(); sync();
      return;
    }
    if (e.target.id === 'weight-form') {
      e.preventDefault();
      var kg = num(document.getElementById('wt-kg').value);
      var date = document.getElementById('wt-date').value || today();
      if (isNaN(kg) || kg < 30 || kg > 300) { toast('Írd be a súlyt kilogrammban, pl. 82,4'); return; }
      var existed = state.weights.some(function (x) { return x.date === date; });
      state.weights = state.weights.filter(function (x) { return x.date !== date; });
      state.weights.push({ date: date, kg: Math.round(kg * 10) / 10 });
      selW = null; save(); render();
      toast(existed ? 'Súly frissítve' : 'Súly elmentve');
      return;
    }
    if (e.target.id === 'goal-form') {
      e.preventDefault();
      var g = num(document.getElementById('goal-kg').value);
      state.goal = isNaN(g) ? null : Math.round(g * 10) / 10;
      save(); render();
      toast(state.goal ? 'Célsúly elmentve' : 'Célsúly törölve');
      return;
    }
    if (e.target.id !== 'add-ex-form') return;
    e.preventDefault();
    var inp = document.getElementById('ex-name');
    var name = inp.value.trim();
    if (!name) { inp.focus(); return; }
    var ex = { id: uid(), name: name, sets: [{ kg: '', reps: '' }] };
    state.active.exercises.push(ex);
    save(); render();
    var f = document.getElementById('kg-' + ex.id + '-0'); if (f) f.focus();
  });

  var rt;
  window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { if (view === 'home') drawCharts(); if (view === 'cut') drawWeight(); }, 150); });

  window.addEventListener('online', sync);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') sync(); });
  setTimeout(sync, 400);
  setTimeout(refreshPush, 1500);
  setInterval(function () { if (document.visibilityState === 'visible') sync(); }, 60000);
  if (location.hash === '#kozos') view = 'social';
  if (state.active) view = 'workout';
  render();

  /* Offline működés, csak a telepíthető változatban (ahol van manifest) */
  try {
    if ('serviceWorker' in navigator && document.querySelector('link[rel="manifest"]')) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
  } catch (e) {}
})();
</script>

</body>
</html>
